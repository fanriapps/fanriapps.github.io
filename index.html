<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fanri</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #5c5c5c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131313;
      --fg: #e8e8e8;
      --muted: #a0a0a0;
    }
  }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0 auto;
    max-width: 42rem;
    padding: 3rem 1.25rem 5rem;
  }
  h1 { font-size: 1.7rem; line-height: 1.25; margin: 0 0 2rem; }
  h2 { font-size: 1.15rem; margin: 0 0 .25rem; }
  p { margin: 0 0 1rem; }
  .muted { color: var(--muted); }
  a { color: inherit; }
</style>
</head>
<body>

<h1>Fanri</h1>

<h2>Carryall</h2>
<p class="muted">Passports, visas and IDs for your family. Offline and encrypted.</p>
<p><a href="carryall/privacy/">Privacy policy</a></p>

</body>
</html>
